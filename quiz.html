<!DOCTYPE html>
<html>
<head>
  <title>Friend Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Answer the Quiz!</h1>
  <form id="quizForm">
    <label>Fav thing to do with friends:
      <input type="text" name="activity">
    </label><br>
    <label>Fav food:
      <input type="text" name="food">
    </label><br>
    <label>Fav colour:
      <input type="text" name="color">
    </label><br>
    <label>Name of first crush:
      <input type="text" name="firstCrush">
    </label><br>
    <label>Name of current crush:
      <input type="text" name="currentCrush">
    </label><br>
    <label>Word used frequently:
      <input type="text" name="word">
    </label><br>
    <button type="submit">Submit Answers</button>
  </form>
  <p id="result"></p>
  <script src="script.js"></script>
</body>
</html>
