<!DOCTYPE html>
<html>
<head>
  <title>Create Friend Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Create Your Friend Quiz</h1>
  <form id="selfForm">
    <label>Fav thing to do with friends:
      <input type="text" name="activity">
    </label><br>
    <label>Fav food:
      <input type="text" name="food">
    </label><br>
    <label>Fav colour:
      <input type="text" name="color">
    </label><br>
    <label>Name of first crush:
      <input type="text" name="firstCrush">
    </label><br>
    <label>Name of current crush:
      <input type="text" name="currentCrush">
    </label><br>
    <label>Word you use frequently:
      <input type="text" name="word">
    </label><br>
    <button type="submit">Generate Quiz Link</button>
  </form>
  <p id="link"></p>
  <script src="script.js"></script>
</body>
</html>
